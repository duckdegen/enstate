name: PR Test
on:
  pull_request:
    branches:
      - master
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  prebuild:
    name: Prebuild ENState 🧪
    uses: ./.github/workflows/prebuild.yml
    secrets: inherit
  test:
    name: Test ENState 🚀
    # runs-on: arc-runner-set
    runs-on: ubuntu-latest
    needs: [prebuild]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        suite: [app] #, worker]
        include:
          - suite: app
            env_file: .env
          # - suite: worker
          #   build: bun install --global pnpm && pnpm install && pnpm build
          #   env_file: .dev.vars
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install
        working-directory: test

      # The secrets are optional: without them the tests run against a public
      # RPC, and without an OpenSea key only the NFT avatars are affected.
      - name: Set-up environment (${{ matrix.env_file }})
        shell: bash
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          cat <<EOF > ${{ matrix.env_file }}
          RPC_URL=${RPC_URL:-https://ethereum-rpc.publicnode.com}
          OPENSEA_API_KEY=${OPENSEA_API_KEY:-none}
          UNIVERSAL_RESOLVER=0x8cab227b1162f03b8338331adaad7aadc83b895e
          REDIS_URL=redis://localhost:6379
          PORT=3000
          EOF
        working-directory: packages/${{ matrix.suite }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: enstate
          path: ./target/release/

      - name: Build
        run: chmod +x ./target/release/enstate

      # - name: Build
      #   run: ${{ matrix.build }}
      #   working-directory: ${{ matrix.suite }}

      - name: Start ENState
        shell: bash
        run: |
          nohup ../../target/release/enstate > enstate.log 2>&1 &

          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              echo "ENState is up"
              exit 0
            fi
            sleep 1
          done

          echo "ENState did not start"
          cat enstate.log
          exit 1
        working-directory: packages/${{ matrix.suite }}

      - name: Test
        run: bun test server --timeout 20000 --rerun-each 2
        working-directory: test

      - name: ENState logs
        if: failure()
        run: tail -n 200 enstate.log
        working-directory: packages/${{ matrix.suite }}
